<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançar Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 selection:bg-emerald-500 selection:text-slate-900">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 my-4">
        <h2 class="text-2xl font-bold text-center mb-6 text-emerald-400">Novo Gasto Finanças</h2>
        
        <form id="gastoForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Categoria</label>
                <select id="categoria" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 h-12">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Casa">Casa</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Roupas">Roupas</option>
                    <option value="Nesco">Nesco</option>
                    <option value="Gasolina / Óleo">Gasolina / Óleo</option>
                    <option value="Compras do Mês">Compras do Mês</option>
                    <option value="Extras">Extras</option>
                    <option value="Bobeirinhas V">Bobeirinhas V</option>
                    <option value="Bobeirinhas J">Bobeirinhas J</option>
                    <option value="PLR">PLR</option>
                    <option value="Motos">Motos</option>
                    <option value="Férias">Férias</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" required placeholder="0,00" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 text-lg h-12">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Data</label>
                <input type="date" id="data" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 h-12">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Motivo (Opcional)</label>
                <input type="text" id="motivo" placeholder="Ex: Compras no mercado X" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 h-12">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Método de Pagamento (Opcional)</label>
                <input type="text" id="metodo" placeholder="Ex: Pix, Crédito Nubank" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 h-12">
            </div>

            <button type="submit" id="btnEnviar" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-lg transition duration-200 text-lg shadow-lg shadow-emerald-900/20 active:scale-[0.98] mt-2">
                Lançar Gasto
            </button>
        </form>

        <div id="status" class="mt-4 text-center hidden p-3 rounded-lg text-sm font-semibold"></div>

        <!-- Divisor Visual e Botão de Saldo -->
        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-xs uppercase tracking-wider">Painel Financeiro</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <button type="button" id="btnSaldo" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 rounded-lg transition duration-200 text-sm border border-slate-600 active:scale-[0.99]">
            📊 Ver Saldo Atual
        </button>
    </div>

    <!-- Container da Tabela Dinâmica de Saldos -->
    <div id="containerSaldo" class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-4 border border-slate-700 mb-6 hidden animate-fadeIn">
        <h3 class="text-md font-bold text-slate-300 mb-3 flex justify-between items-center">
            <span>Dinheiro Restante (Mês Atual)</span>
            <span class="text-xs font-normal text-slate-500">Puxado direto da planilha</span>
        </h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider">
                    <tr>
                        <th class="p-2.5 rounded-l-lg">Restante</th>
                        <th class="p-2.5 text-right">Valores</th>
                        <th class="p-2.5 text-right rounded-r-lg">Acumulado</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaSaldo" class="divide-y divide-slate-700/50">
                    <!-- Inserido dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfxFIe1vpcvnJcX5oqC1DyAaOVw9YnvLwFqELYvDBXAKoIWWRMve_KP0FysgkEUL1Wpg/exec";

        document.getElementById('data').value = new Date().toISOString().split('T')[0];

        // LÓGICA 1: LANÇAR GASTO
        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const statusDiv = document.getElementById('status');
            
            const categoria = encodeURIComponent(document.getElementById('categoria').value);
            const valor = document.getElementById('valor').value;
            const data = document.getElementById('data').value;
            const motivo = encodeURIComponent(document.getElementById('motivo').value || "");
            const metodo = encodeURIComponent(document.getElementById('metodo').value || "");

            btn.disabled = true;
            btn.innerText = "Enviando...";
            statusDiv.classList.add('hidden');

            const urlFinal = `${WEB_APP_URL}?categoria=${categoria}&valor=${valor}&data=${data}&motivo=${motivo}&metodo=${metodo}`;

            try {
                const response = await fetch(urlFinal);
                const resultado = await response.json();

                if (resultado.status === "sucesso") {
                    statusDiv.innerText = "Gasto lançado com sucesso! 🎉";
                    statusDiv.className = "mt-4 text-center p-3 rounded-lg text-sm font-semibold bg-emerald-500/20 text-emerald-400";
                    statusDiv.classList.remove('hidden');
                    document.getElementById('gastoForm').reset();
                    document.getElementById('data').value = new Date().toISOString().split('T')[0];
                    
                    document.getElementById('containerSaldo').classList.add('hidden');
                } else {
                    statusDiv.innerText = `Erro: ${resultado.message} ❌`;
                    statusDiv.className = "mt-4 text-center p-3 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400";
                    statusDiv.classList.remove('hidden');
                }
            } catch (error) {
                statusDiv.innerText = "Erro na conexão com o servidor.";
                statusDiv.className = "mt-4 text-center p-3 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400";
                statusDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Lançar Gasto";
            }
        });

        // LÓGICA 2: BUSCAR SALDO ATUAL
        document.getElementById('btnSaldo').addEventListener('click', async () => {
            const btn = document.getElementById('btnSaldo');
            const statusDiv = document.getElementById('status');
            const containerSaldo = document.getElementById('containerSaldo');
            const corpoTabela = document.getElementById('corpoTabelaSaldo');

            btn.disabled = true;
            btn.innerText = "🔄 Consultando Planilha...";
            statusDiv.classList.add('hidden');
            containerSaldo.classList.add('hidden');

            const urlConsulta = `${WEB_APP_URL}?acao=lerSaldo`;

            try {
                const response = await fetch(urlConsulta);
                const resultado = await response.json();

                if (resultado.status === "sucesso") {
                    corpoTabela.innerHTML = ""; 
                    
                    resultado.dados.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-700/30 transition-colors";
                        
                        const isNegVal = item.restante.includes('-');
                        const isNegAcum = item.acumulado.includes('-');
                        
                        const colRestanteColor = isNegVal ? 'text-red-400' : 'text-emerald-400';
                        const colAcumColor = isNegAcum ? 'text-red-400' : 'text-emerald-400';

                        tr.innerHTML = `
                            <td class="p-2.5 font-medium text-slate-200">${item.categoria}</td>
                            <td class="p-2.5 text-right font-mono ${colRestanteColor}">${item.restante}</td>
                            <td class="p-2.5 text-right font-mono ${colAcumColor}">${item.acumulado}</td>
                        `;
                        corpoTabela.appendChild(tr);
                    });

                    containerSaldo.classList.remove('hidden');
                } else {
                    statusDiv.innerText = `Erro: ${resultado.message} ❌`;
                    statusDiv.className = "mt-4 text-center p-3 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400";
                    statusDiv.classList.remove('hidden');
                }
            } catch (error) {
                statusDiv.innerText = "Erro ao buscar dados de saldo.";
                statusDiv.className = "mt-4 text-center p-3 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400";
                statusDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "📊 Ver Saldo Atual";
            }
        });
    </script>
</body>
</html>
